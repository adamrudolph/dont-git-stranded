name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && git --version && python3 --version
      - name: Build
        run: swift build
      - name: Test (app scanner + CLI)
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
